info:
  description: API for managing expenses
  title: Expenses API
  version: 1.0.0

openapi: 3.0.0

servers:
  -url: k8s-expensem-expensem-9529348a37-1547006987.us-west-1.elb.amazonaws.com
  description: ALB's hostname

paths:
  /api/v1/expense-categories:
    get:
      operationId: get_categories_api_v1_expense_categories_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExpenseCategoriesSchema'
          description: Successful Response
        '403': 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPForbiddenError'
          description: Forbidden
      summary: Get Categories
    post:
      operationId: create_category_api_v1_expense_categories_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseCategorySchema'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExpenseCategorySchema'
          description: Successful Response
          links:
            update_category_api_v1_expense_categories__category_id__put:
              operationId: update_category_api_v1_expense_categories__category_id__put
              parameters:
                category_id: '$response.body#/id'
              description: The `id` value returned in the response can be used as the `category_id` value in the path parameter of the `update_category_api_v1_expense_categories__category_id__put` endpoint.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPForbiddenError'
          description: Forbidden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Category
  /api/v1/expense-categories/{category_id}:
    put:
      operationId: update_category_api_v1_expense_categories__category_id__put
      parameters:
      - in: path
        name: category_id
        required: true
        schema:
          format: uuid
          title: Category Id
          type: string
        example: d290f1ee-6c54-4b01-90e6-d701748f0851
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseCategorySchema'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExpenseCategorySchema'
          description: Successful Response
        '403': 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPForbiddenError'
          description: Forbidden
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Category
  /api/v1/expenses:
    get:
      operationId: get_expenses_api_v1_expenses_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExpensesSchema'
          description: Successful Response            
      summary: Get Expenses
    post:
      operationId: create_expense_api_v1_expenses_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseSchema'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExpenseSchema'
          description: Successful Response
          links:
            get_expense_api_v1_expenses__expense_id__get:
              operationId: get_expense_api_v1_expenses__expense_id__get
              parameters:
                expense_id: '$response.body#/id'
              description: The `id` value returned in the response can be used as the `expense_id` value in the path parameter of the `get_expense_api_v1_expenses__expense_id__get` endpoint.
            update_expense_api_v1_expenses__expense_id__put:
              operationId: update_expense_api_v1_expenses__expense_id__put
              parameters:
                expense_id: '$response.body#/id'
              description: The `id` value returned in the response can be used as the `expense_id` value in the path parameter of the `update_expense_api_v1_expenses__expense_id__put` endpoint.
            delete_expense_api_v1_expenses__expense_id__delete:
              operationId: delete_expense_api_v1_expenses__expense_id__delete
              parameters:
                expense_id: '$response.body#/id'
              description: The `id` value returned in the response can be used as the `expense_id` value in the path parameter of the `delete_expense_api_v1_expenses__expense_id__delete` endpoint.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Expense
  /api/v1/expenses/{expense_id}:
    get:
      operationId: get_expense_api_v1_expenses__expense_id__get
      parameters:
      - in: path
        name: expense_id
        required: true
        schema:
          format: uuid
          title: Expense Id
          type: string
        example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSchema'
          description: Successful Response
      summary: Get Expense
    put:
      operationId: update_expense_api_v1_expenses__expense_id__put
      parameters:
      - in: path
        name: expense_id
        required: true
        schema:
          format: uuid
          title: Expense Id
          type: string
        example: d290f1ee-6c54-4b01-90e6-d701748f0851
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseSchema'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetExpenseSchema'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Expense
    delete:
      operationId: delete_expense_api_v1_expenses__expense_id__delete
      parameters:
      - in: path
        name: expense_id
        required: true
        schema:
          format: uuid
          title: Expense Id
          type: string
        example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '204':
          description: Successful Response
      summary: Delete Expense
